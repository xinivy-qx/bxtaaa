<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: pink;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff4f81;
        }

        h2 {
            color: #555;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #noButton {
            background: #ddd;
        }

        #yesButton {
            background: #ff4f81;
            color: white;
        }

        #vinnyPic {
    display: none;
    width: 250px;
    max-width: 80vw;
    margin-top: 20px;
    border-radius: 20px;
}
        @keyframes fall {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }
}
    </style>
</head>

<body>

</script>
    <div class="container">

        <h1>bxta, sikret lng 2</h1>

        <h2>pogi ka ba?</h2>

        <button id="noButton">hindi naman</button>

        <button id="yesButton">super</button>
<img id="vinnyPic" src="{{ url_for('static', filename='download (5).jpg') }}">
    </div>
<script>
    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");

    noButton.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
        const y = Math.random() * (window.innerHeight - noButton.offsetHeight);

        noButton.style.position = "fixed";
        noButton.style.left = x + "px";
        noButton.style.top = y + "px";
    });

   yesButton.addEventListener("click", function() {
const picture = document.getElementById("vinnyPic");
picture.style.display = "block";
    for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");

        heart.innerHTML = "❤️";
        heart.style.position = "fixed";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "-30px";
        heart.style.fontSize = Math.random() * 20 + 20 + "px";
        heart.style.zIndex = "10";
        heart.style.animation = "fall 3s linear forwards";

        document.body.appendChild(heart);

        setTimeout(function() {
            heart.remove();
        }, 3000);
    }
});
</script>
</body>
</html>
